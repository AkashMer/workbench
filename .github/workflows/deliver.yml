# =============================================================================
# Deliver
# =============================================================================
# Manually triggered. Takes the built markdown and attachments for a given
# post slug and delivers them to the Inbox/ folder in the private vault repo
# (The-Nole-Nexus), where they can be processed (citations, review) before
# being moved into Nole-Nexus Website/ for publishing.
#
# Trigger: workflow_dispatch with a slug input
# Destination: Inbox/{slug}/ in AkashMer/The-Nole-Nexus
# =============================================================================

name: Deliver

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Post slug (e.g. noda-rep-maps-pipeline)"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deliver:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # 1. Check out the workbench repo to access the built post
      # -----------------------------------------------------------------------
      - name: Checkout workbench repo
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Clone the private vault repo using the Inbox PAT
      # -----------------------------------------------------------------------
      - name: Clone private vault repo
        env:
          INBOX_PAT: ${{ secrets.INBOX_PAT }}
        run: |
          git clone https://AkashMer:${INBOX_PAT}@github.com/AkashMer/The-Nole-Nexus.git private-repo

      # -----------------------------------------------------------------------
      # 3. Copy the built markdown and attachments into Inbox/{slug}/
      # -----------------------------------------------------------------------
      - name: Copy post to Inbox
        run: |
          SLUG="${{ github.event.inputs.slug }}"
          mkdir -p private-repo/Inbox/${SLUG}
          cp scripts/${SLUG}/${SLUG}.md private-repo/Inbox/${SLUG}/
          if [ -d "scripts/${SLUG}/attachments" ]; then
            cp -r scripts/${SLUG}/attachments private-repo/Inbox/${SLUG}/
          fi
          if [ -d "scripts/${SLUG}/${SLUG}_files" ]; then
            cp -r scripts/${SLUG}/${SLUG}_files private-repo/Inbox/${SLUG}/
          fi

      # -----------------------------------------------------------------------
      # 4. Commit and push to the private vault repo
      # -----------------------------------------------------------------------
      - name: Commit and push
        env:
          INBOX_PAT: ${{ secrets.INBOX_PAT }}
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          cd private-repo
          git add .
          git diff --staged --quiet || git commit -m "Inbox: ${{ github.event.inputs.slug }}"
          git push
